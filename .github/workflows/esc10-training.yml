name: Train and publish ESC-10 sound baseline

on:
  push:
    branches: [main]
    paths:
      - 'ml/real_audio/**'
      - '.github/workflows/esc10-training.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  esc10:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install reproducible dependencies
        run: python -m pip install -r requirements.txt
      - name: Retrieve official ESC-50 source
        run: |
          git init data/ESC-50
          git -C data/ESC-50 fetch --depth 1 https://github.com/karolpiczak/ESC-50.git 33c8ce9eb2cf0b1c2f8bcf322eb349b6be34dbb6
          git -C data/ESC-50 checkout --detach FETCH_HEAD
      - name: Train official five-fold ESC-10 baseline
        run: >-
          python -m ml.real_audio.esc10 train
          --dataset data/ESC-50
          --model ml/artifacts/esc10.joblib
          --metrics ml/artifacts/esc10_metrics.json
      - name: Smoke-test saved checkpoint inference on an ESC-10 source clip
        run: |
          python - <<'PY'
          from pathlib import Path
          from ml.real_audio.esc10 import ESC10Predictor, esc10_manifest, load_audio
          root = Path('data/ESC-50')
          # The final checkpoint was fitted on all 400 clips, including this one.
          manifest = esc10_manifest(root)
          source = manifest[0]
          predictor = ESC10Predictor(Path('ml/artifacts/esc10.joblib'))
          label, confidence = predictor.predict(load_audio(root / 'audio' / source['filename']))
          assert label in {entry['category'] for entry in manifest}
          assert 0.0 <= confidence <= 1.0
          print(f'Loaded saved model; real audio class={label}, confidence={confidence:.3f}')
          PY
      - name: Hash generated checkpoint
        run: sha256sum ml/artifacts/esc10.joblib > ml/artifacts/esc10.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: esc10-real-audio-baseline
          path: |
            ml/artifacts/esc10.joblib
            ml/artifacts/esc10_metrics.json
            ml/artifacts/esc10.sha256
          retention-days: 90
      - name: Publish reproducible baseline as a GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view esc10-baseline >/dev/null 2>&1; then
            echo "Baseline release already exists. This run's outputs are in the workflow artifact."
          else
            gh release create esc10-baseline \
              ml/artifacts/esc10.joblib ml/artifacts/esc10_metrics.json ml/artifacts/esc10.sha256 \
              --title 'ESC-10 environmental sound baseline' \
              --notes 'Five official ESC-10 folds. Non-clinical environmental sound recognition only. Dataset by Karol Piczak; ESC-10 is CC BY licensed. Review esc10_metrics.json for results.'
          fi
