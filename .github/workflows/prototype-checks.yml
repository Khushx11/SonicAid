name: Prototype checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Audit frontend dependencies
        run: npm audit --prefix frontend --audit-level=high
      - name: Check frontend types
        run: npm run typecheck --prefix frontend
      - name: Test microphone sample-rate conversion
        run: node --test frontend/tests/microphone-processor.test.mjs
      - name: Compile frontend
        run: npm run build --prefix frontend

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run backend tests
        run: python -m pytest backend/tests -q
      - name: Install and exercise the published ESC-10 checkpoint
        env:
          SONICAID_ESC10_MODEL: ${{ runner.temp }}/esc10.joblib
        run: |
          python -m scripts.install_esc10_model --output "$SONICAID_ESC10_MODEL"
          python - <<'PY'
          import numpy as np
          from fastapi.testclient import TestClient

          from backend.app.main import app

          sample_rate = 16000
          second = np.arange(sample_rate) / sample_rate
          pcm = (4000 * np.sin(2 * np.pi * 440 * second)).astype("<i2").tobytes()
          with TestClient(app) as client:
              with client.websocket_connect("/ws/stream") as socket:
                  assert socket.receive_json() == {
                      "type": "status", "status": "ready", "model": "ESC-10"
                  }
                  for _ in range(5):
                      socket.send_bytes(pcm)
                  prediction = socket.receive_json()
                  assert prediction["window_start"] == 0.0
                  assert prediction["window_end"] == 5.0
                  assert prediction["env_tags"] == ["esc10_environmental_sound"]
                  assert prediction["primary_class"]
                  assert 0.0 <= prediction["primary_confidence"] <= 1.0
                  assert prediction["emotion"] is None
                  assert prediction["engagement_score"] is None
          PY

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the dashboard for the browser integration check
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          python -m pip install playwright==1.65.2
          python -m playwright install --with-deps chromium
      - name: Stream browser microphone audio to the published checkpoint
        env:
          SONICAID_ESC10_MODEL: ${{ runner.temp }}/esc10.joblib
        run: |
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 &
          backend_pid=$!
          npm run preview --prefix frontend -- --host 127.0.0.1 --port 5173 --strictPort &
          frontend_pid=$!
          trap 'kill "$backend_pid" "$frontend_pid" 2>/dev/null || true' EXIT
          curl --silent --show-error --fail --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/api/health
          curl --silent --show-error --fail --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:5173/ > /dev/null
          python frontend/tests/microphone_smoke.py
