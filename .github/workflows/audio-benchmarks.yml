name: Expanded environmental sound benchmarks

on:
  pull_request:
    paths:
      - 'ml/real_audio/**'
      - '.github/workflows/audio-benchmarks.yml'
  push:
    branches: [main]
    paths:
      - 'ml/real_audio/benchmarks.py'
      - '.github/workflows/audio-benchmarks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dataset: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["esc50","urbansound8k"]' || '["esc50"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Retrieve pinned ESC-50
        if: matrix.dataset == 'esc50'
        run: |
          git init data/ESC-50
          git -C data/ESC-50 fetch --depth 1 https://github.com/karolpiczak/ESC-50.git 33c8ce9eb2cf0b1c2f8bcf322eb349b6be34dbb6
          git -C data/ESC-50 checkout --detach FETCH_HEAD
          echo 'AUDIO_ROOT=data/ESC-50' >> "$GITHUB_ENV"
      - name: Retrieve UrbanSound8K from Zenodo
        if: matrix.dataset == 'urbansound8k'
        run: |
          mkdir -p data
          curl --fail --location --retry 2 --retry-max-time 1200 --max-time 600 \
            'https://zenodo.org/records/1203745/files/UrbanSound8K.tar.gz?download=1' \
            --output data/UrbanSound8K.tar.gz
          echo '9aa69802bbf37fb986f71ec1483a196e  data/UrbanSound8K.tar.gz' | md5sum --check
          tar -xzf data/UrbanSound8K.tar.gz -C data
          echo 'AUDIO_ROOT=data/UrbanSound8K' >> "$GITHUB_ENV"
      - name: Evaluate official held-out folds
        env:
          DATASET: ${{ matrix.dataset }}
        run: |
          python -m ml.real_audio.benchmarks "$DATASET" --root "$AUDIO_ROOT" --metrics "ml/artifacts/$DATASET.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.dataset }}-metrics
          path: ml/artifacts/${{ matrix.dataset }}.json
          if-no-files-found: error
