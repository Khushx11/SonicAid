services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SONICAID_ENV: dev
      SONICAID_ESC10_MODEL: /models/esc10.joblib
    volumes:
      - esc10-model:/models
    command: >
      sh -ec 'python -m scripts.install_esc10_model --output "$$SONICAID_ESC10_MODEL"
      && exec uvicorn backend.app.main:app --host 0.0.0.0 --port 8000'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=5).close()"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 3m

  frontend:
    image: node:22-bookworm
    working_dir: /app
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8000
    volumes:
      - ./frontend:/app:ro
      - frontend-dependencies:/app/node_modules
    command: sh -ec "npm ci && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  esc10-model:
  frontend-dependencies:
