services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SONICAID_ENV: dev
      SONICAID_ESC10_MODEL: /models/esc10.joblib
    volumes:
      - esc10-model:/models
    command: >
      sh -ec 'python -m scripts.install_esc10_model --output "$$SONICAID_ESC10_MODEL"
      && exec uvicorn backend.app.main:app --host 0.0.0.0 --port 8000'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=5).close()"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 3m

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 6
    depends_on:
      backend:
        condition: service_healthy

volumes:
  esc10-model:
