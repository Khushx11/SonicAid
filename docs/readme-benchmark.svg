<line x1="64" x2="660" y1="109" y2="109" stroke="#2e4960" /><text x="52" y="113" text-anchor="end" font-size="12">90</text>
<line x1="64" x2="660" y1="69" y2="69" stroke="#2e4960" /><text x="52" y="73" text-anchor="end" font-size="12">100</text>
<circle cx="98" cy="184" r="6" fill="#5de0cf"/><text x="98" y="172" text-anchor="middle" font-weight="700" font-size="13">71.25%</text><text x="98" y="252" text-anchor="middle" font-size="13">Fold 1</text>
<circle cx="225" cy="139" r="6" fill="#5de0cf"/><text x="225" y="127" text-anchor="middle" font-weight="700" font-size="13">82.50%</text><text x="225" y="252" text-anchor="middle" font-size="13">Fold 2</text>
<circle cx="352" cy="159" r="6" fill="#5de0cf"/><text x="352" y="147" text-anchor="middle" font-weight="700" font-size="13">77.50%</text><text x="352" y="252" text-anchor="middle" font-size="13">Fold 3</text>
<circle cx="479" cy="119" r="6" fill="#5de0cf"/><text x="479" y="107" text-anchor="middle" font-weight="700" font-size="13">87.50%</text><text x="479" y="252" text-anchor="middle" font-size="13">Fold 4</text>
<circle cx="606" cy="144" r="6" fill="#5de0cf"/><text x="606" y="132" text-anchor="middle" font-weight="700" font-size="13">81.25%</text><text x="606" y="252" text-anchor="middle" font-size="13">Fold 5</text>
<circle cx="69" cy="280" r="5" fill="#5de0cf"/><text x="81" y="284" font-size="12">Held-out fold</text>
<line x1="190" x2="218" y1="280" y2="280" stroke="#fbbf69" stroke-width="2" stroke-dasharray="5 4"/><text x="227" y="284" font-size="12">Pooled accuracy · 80.00%</text>
</g></svg>
