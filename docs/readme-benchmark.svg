<svg xmlns="http://www.w3.org/2000/svg" width="700" height="306" viewBox="0 0 700 306" role="img" aria-labelledby="title desc">
<title id="title">ESC-10 · every held-out fold</title>
<desc id="desc">Accuracy in folds one through five: 71.25%, 82.50%, 77.50%, 87.50%, 81.25%. Pooled accuracy is 80.00% across 400 recordings. The vertical scale spans 60 to 100 percent.</desc>
<rect width="700" height="306" rx="14" fill="#102033"/>
