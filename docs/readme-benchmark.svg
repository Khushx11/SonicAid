<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title detail" width="720" height="204" viewBox="0 0 720 204">
<title id="title">ESC-10 fold accuracy</title>
<desc id="detail">Lowest fold 71.25%; Pooled out-of-fold 80%; Highest fold 87.5%. Scale begins at zero.</desc>
<rect width="720" height="204" rx="12" fill="#eef4f8"/>
<g font-family="system-ui, sans-serif" fill="#172c42"><text x="24" y="31" font-size="19" font-weight="700">ESC-10 fold accuracy</text>
<text x="24" y="69" font-size="14">Lowest fold</text><rect x="209" y="54" width="394" height="20" rx="4" fill="#d5e2eb"/><rect x="209" y="54" width="280.73" height="20" rx="4" fill="#146c79"/><text x="619" y="69" font-size="14">71.25%</text>
<text x="24" y="108" font-size="14">Pooled out-of-fold</text><rect x="209" y="93" width="394" height="20" rx="4" fill="#d5e2eb"/><rect x="209" y="93" width="315.20" height="20" rx="4" fill="#2f5687"/><text x="619" y="108" font-size="14">80%</text>
<text x="24" y="147" font-size="14">Highest fold</text><rect x="209" y="132" width="394" height="20" rx="4" fill="#d5e2eb"/><rect x="209" y="132" width="344.75" height="20" rx="4" fill="#2f5687"/><text x="619" y="147" font-size="14">87.5%</text>
<text x="209" y="189" font-size="12">0</text><text x="602" y="189" text-anchor="end" font-size="12">100%</text></g>
</svg>
