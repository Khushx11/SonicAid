<text x="24" y="32" font-size="22" font-weight="700">ESC-10 · every held-out fold</text>
<text x="24" y="55" font-size="13" fill="#b4cadb">Accuracy (%) · 80 recordings per fold · 400 recordings total</text>
<line x1="64" x2="660" y1="229" y2="229" stroke="#2e4960" /><text x="52" y="233" text-anchor="end" font-size="12">60</text>
<line x1="64" x2="660" y1="189" y2="189" stroke="#2e4960" /><text x="52" y="193" text-anchor="end" font-size="12">70</text>
