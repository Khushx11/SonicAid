app:
  name: "sonicaid-dev"
  host: "0.0.0.0"
  port: 8000
  log_level: "debug"

ml:
  model_path: "ml/artifacts/sonicaid_multitask_dev.pt"
  device: "cpu"

streaming:
  sample_rate: 16000
  window_seconds: 1.0
  hop_seconds: 0.5
  max_session_seconds: 3600

privacy:
  enable_anonymization: true
  store_raw_audio: false

