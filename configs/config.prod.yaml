app:
  name: "sonicaid-prod"
  host: "0.0.0.0"
  port: 8000
  log_level: "info"

ml:
  model_path: "ml/artifacts/sonicaid_multitask_prod.pt"
  device: "cuda"

streaming:
  sample_rate: 16000
  window_seconds: 1.0
  hop_seconds: 0.5
  max_session_seconds: 7200

privacy:
  enable_anonymization: true
  store_raw_audio: false

